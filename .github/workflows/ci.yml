name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skill-check:
    name: Validate skills
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate SKILL.md files
        # Upstream README says @v1, but no floating v1 tag exists — pin to a real release.
        uses: thedaviddias/skill-check@v1.2.0
        with:
          path: .
          format: text
          # Security scanning pulls extra Python tooling; keep the required
          # check fast and deterministic. Flip to true once it's vetted.
          security-scan: false
